<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Forest Green Circle -->
  <circle cx="256" cy="256" r="240" fill="#0b1f17" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#D4AF37" stroke-width="6" opacity="0.85" />
  
  <!-- Elegant Inner Gold Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#E5C158" stroke-width="2" stroke-dasharray="8 8" opacity="0.7" />

  <!-- Center Decorative Food Display / Bell / Plate Shadow -->
  <path d="M 256 140 c -50 0 -90 40 -90 90 l 180 0 c 0 -50 -40 -90 -90 -90 z" fill="#D4AF37" opacity="0.25" />
  
  <!-- Minimalist Cloche / Food Cover (Dinner By Design Vibe) -->
  <path d="M 146 250 a 110 110 0 0 1 220 0 Z" fill="none" stroke="#E5C158" stroke-width="8" stroke-linecap="round" />
  <rect x="236" y="125" width="40" height="12" rx="6" fill="#E5C158" />
  <line x1="256" y1="137" x2="256" y2="140" stroke="#E5C158" stroke-width="8" />
  
  <!-- Base Plate line of the cloche with soft gold glow -->
  <path d="M 120 260 L 392 260" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" />
  <path d="M 140 272 L 372 272" stroke="#E5C158" stroke-width="4" stroke-linecap="round" opacity="0.5" stroke-dasharray="4 4" />

  <!-- Elegant crossed Fork and Knife below -->
  <g transform="translate(256, 350) scale(1.1)">
    <!-- Fork left-tilted -->
    <path d="M -30 -40 L -30 20 M -30 20 L -30 40 M -45 -40 L -45 -10 M -15 -40 L -15 -10" stroke="#E5C158" stroke-width="4" stroke-linecap="round" fill="none" transform="rotate(-25)" />
    <!-- Knife right-tilted -->
    <path d="M 30 -40 L 30 20 M 30 20 L 30 40 M 30 -40 C 45 -40 45 -15 30 0" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" fill="none" transform="rotate(25)" />
  </g>

  <!-- Title Monogram letters in the middle -->
  <text x="256" y="320" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="28" font-weight="bold" fill="#E5C158" text-anchor="middle" letter-spacing="4">D x D</text>
</svg>
