name: Quality and production monitoring

on:
  push:
  pull_request:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-and-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  dependency-audit:
    name: High and critical dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

  production-smoke:
    name: Production smoke checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run safe production browser checks
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://dinnerbydesign.app
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_RUN_LIVE_JOURNEY: ${{ secrets.E2E_RUN_LIVE_JOURNEY }}

      - name: Check shallow health endpoint
        run: curl --fail-with-body --silent --show-error --max-time 20 https://dinnerbydesign.app/api/health

      - name: Check protected deep health endpoint
        run: curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $CRON_SECRET" https://dinnerbydesign.app/api/health/deep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Upload browser traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-artifacts
          path: test-results/
          if-no-files-found: ignore
