name: Production monitoring

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitoring
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: High and critical dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

  production-smoke:
    name: Production smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run safe production browser checks
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://dinnerbydesign.app
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_RUN_LIVE_JOURNEY: ${{ secrets.E2E_RUN_LIVE_JOURNEY }}

      - name: Upload browser traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-artifacts
          path: test-results/
          if-no-files-found: ignore

  production-health:
    name: Production health endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check shallow health endpoint
        run: curl --fail-with-body --silent --show-error --max-time 20 https://dinnerbydesign.app/api/health

      - name: Verify protected monitoring secret is configured
        run: test -n "$CRON_SECRET"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Check protected deep health endpoint
        run: >-
          curl --fail-with-body --silent --show-error --max-time 30
          -H "Authorization: Bearer $CRON_SECRET"
          https://dinnerbydesign.app/api/health/deep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
