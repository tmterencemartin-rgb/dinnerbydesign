name: Production monitoring

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitoring
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: High and critical dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high

  public-content-smoke:
    name: Public pages, sitemap and health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check live public pages
        run: npm run smoke:public
        env:
          PUBLIC_SMOKE_BASE_URL: https://dinnerbydesign.app

  production-browser:
    name: Read-only browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run read-only production browser checks
        run: npx playwright test e2e/monitoring-safe.spec.ts
        env:
          E2E_BASE_URL: https://dinnerbydesign.app

      - name: Upload browser traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-artifacts
          path: test-results/
          if-no-files-found: ignore

  production-health:
    name: Production health endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check shallow health endpoint
        run: curl --fail-with-body --silent --show-error --max-time 20 https://dinnerbydesign.app/api/health
